[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurorabid"
version = "0.2.0"
description = "A reproducible, budget-constrained advertising auction simulator"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<1.9",
  "matplotlib>=3.8,<4", "joblib>=1.3,<2", "gymnasium==1.2.0",
  "stable-baselines3==2.7.0", "torch>=2.3,<3",
  "fastapi==0.116.1", "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "httpx==0.28.1", "nbformat==5.10.4", "nbconvert==7.16.6", "ipykernel>=6,<7"]

[project.scripts]
aurorabid = "aurorabid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
