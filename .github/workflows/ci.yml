name: Tests and reproducible demo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: aurorabid reproduce --output outputs/smoke --rows 2000 --seeds 42 --ppo-steps 512
      - run: jupyter nbconvert --to notebook --execute notebooks/demo.ipynb --output /tmp/aurorabid-demo.ipynb
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            outputs/smoke/RESULTS.md
            outputs/smoke/*metrics.json
            outputs/smoke/*results.csv
            outputs/smoke/*.png
