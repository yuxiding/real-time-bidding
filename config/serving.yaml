# config/serving.yaml

server:
  host: 0.0.0.0
  port: 8000
  reload: true

feature_store:
  path: data/processed

model_server:
  checkpoint_dir: checkpoints
  refresh_interval_sec: 600

bid:
  max_bid: 5.0
  strategy: rl

latency_monitor:
  enable: true
  threshold_ms: 200
  log_path: logs/latency.log
