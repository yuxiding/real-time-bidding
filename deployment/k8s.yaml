apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurora-bid-deployment
  labels:
    app: aurora-bid
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aurora-bid
  template:
    metadata:
      labels:
        app: aurora-bid
    spec:
      containers:
      - name: aurora-bid-container
        image: aurora-bid:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: aurora-bid-service
spec:
  selector:
    app: aurora-bid
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
